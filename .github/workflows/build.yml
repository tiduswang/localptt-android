name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 已预装 Android SDK，sdkmanager 不在 PATH 里（cmdline-tools 路径随镜像变化），
      # 这里先自己找一遍，装上缺的包；找不到也不让构建失败，后面用已装的版本。
      - name: Ensure Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_BIN="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin 2>/dev/null | head -1)"
          if [ -n "$SDK_BIN" ] && [ -x "$SDK_BIN/sdkmanager" ]; then
            yes | "$SDK_BIN/sdkmanager" --licenses > /dev/null || true
            "$SDK_BIN/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          else
            echo "sdkmanager 未找到，使用 runner 预装 SDK"
          fi
          echo "--- platforms ---"; ls "$ANDROID_HOME/platforms" || true
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: localptt-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  # 打 tag（v1.3.x）时自动发布 Release 并附上 APK，README 里的下载链接即可直接用。
  publish-release:
    name: publishRelease
    needs: assemble-debug
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 只有这一层需要写权限（创建 Release / 上传附件）
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: localptt-debug-apk
          path: dist

      - name: Rename APK
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mv dist/app-debug.apk "dist/localptt-${VER}-debug.apk"
          ls -l dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # 这一步没 checkout，gh 需要显式指定仓库
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="自动构建的 debug 安装包（仅用于测试）。更新内容见 CHANGELOG.md 的 ${TAG} 段落。"
          gh release create "$TAG" dist/*.apk --title "localptt ${TAG}" --notes "$NOTES" \
            || gh release upload "$TAG" dist/*.apk --clobber
