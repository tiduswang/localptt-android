name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 已预装 Android SDK，sdkmanager 不在 PATH 里（cmdline-tools 路径随镜像变化），
      # 这里先自己找一遍，装上缺的包；找不到也不让构建失败，后面用已装的版本。
      - name: Ensure Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_BIN="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin 2>/dev/null | head -1)"
          if [ -n "$SDK_BIN" ] && [ -x "$SDK_BIN/sdkmanager" ]; then
            yes | "$SDK_BIN/sdkmanager" --licenses > /dev/null || true
            "$SDK_BIN/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          else
            echo "sdkmanager 未找到，使用 runner 预装 SDK"
          fi
          echo "--- platforms ---"; ls "$ANDROID_HOME/platforms" || true
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 仓库里的 wrapper jar 不是官方发布的原包，校验会误报；
          # 这里关掉校验，仍然使用项目自带的 wrapper（版本与本地一致）
          validate-wrappers: false

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: localptt-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
